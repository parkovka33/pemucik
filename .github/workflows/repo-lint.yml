name: Repo Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify required files exist
        run: |
          test -f AGENTS.md
          test -f MEMORY.md
          test -f REVIEW-CHECKLIST.md
          test -f README.md
          test -f agent_docs/code_patterns.md
          test -f agent_docs/product_requirements.md
          test -f agent_docs/project_brief.md
          test -f agent_docs/tech_stack.md
          test -f agent_docs/testing.md
          test -f docs/LISTING.md
          test -f docs/QUICKSTART.md
          test -f docs/RELEASE-CHECKLIST.md
          test -f docs/TROUBLESHOOTING.md
          test -f .github/GOVERNANCE.md
          test -f .github/SUPPORT.md
          test -f .github/FAQ.md
          test -f .github/workflows/greetings.yml
          test -f .github/workflows/pr-size-labeler.yml

      - name: Reject placeholder security contact
        run: |
          if grep -rn "\[your-email\]" .github/SECURITY.md; then
            echo "ERROR: Unresolved [your-email] placeholder found in SECURITY.md"
            exit 1
          fi

      - name: Reject outdated actions/checkout versions
        run: |
          if grep -rn "actions/checkout@v[0-5]" README.md docs/ agent_docs/ .github/; then
            echo "ERROR: Outdated actions/checkout version found. Update to @v6."
            exit 1
          fi

      - name: Reject stale template-era references
        run: |
          if grep -rEn --exclude=repo-lint.yml "Vibe-Coding Prompt Template|templates/|part[0-9-].*\.md|docs/freshness-policy\.md|docs/golden-path-checklist\.md|docs/claude-agent-teams\.md|docs/cursor-cloud-agents\.md" README.md docs/ agent_docs/ .github/; then
            echo "ERROR: Stale template-era reference found. Update the repo docs/workflows to XenoVoice paths and terminology."
            exit 1
          fi

      - name: Reject broken canonical filename references
        run: |
          if grep -rEn --exclude=repo-lint.yml '`PRD\.md`|`TechDesign\.md`' README.md docs/ agent_docs/ .github/; then
            echo "ERROR: Stale PRD.md / TechDesign.md filename reference found. Use PRD-[AppName]-MVP.md and TechDesign-[AppName]-MVP.md."
            exit 1
          fi

      - name: Reject stale research filename references
        run: |
          if grep -rEn --exclude=repo-lint.yml 'research-.*\.txt' README.md docs/ agent_docs/ .github/; then
            echo "ERROR: Stale research-*.txt reference found. Update to the markdown filename."
            exit 1
          fi

      - name: Warn on hardcoded price claims
        run: |
          if grep -rEn '\$[0-9]+(/mo|/month)' README.md docs/ .github/ | grep -vi 'under \$.*month\|up to \$.*month\|Budget.*Free only'; then
            echo "ERROR: Hardcoded pricing detected. Replace with verification language."
            exit 1
          fi
